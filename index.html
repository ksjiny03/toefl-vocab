<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEFL 단어장 103일</title>
<style>
:root {
  --primary:#2563eb; --primary-dark:#1d4ed8;
  --navy:#1e3a5f;
  --success:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8fafc; --white:#fff; --text:#1e293b; --muted:#64748b; --border:#e2e8f0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* header */
header{background:var(--navy);color:white;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.25);}
header h1{font-size:1.1rem;font-weight:700;}
header .hstats{font-size:.8rem;opacity:.8;}

/* tabs */
.tab-bar{background:white;display:flex;border-bottom:2px solid var(--border);padding:0 14px;overflow-x:auto;}
.tab{padding:11px 16px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .18s;}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);}

.container{max-width:860px;margin:0 auto;padding:18px 14px;}

/* day grid */
.day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin-bottom:18px;}
.day-btn{padding:8px 3px;text-align:center;border:2px solid var(--border);border-radius:9px;cursor:pointer;font-size:.75rem;font-weight:600;background:white;transition:all .12s;position:relative;}
.day-btn:hover{border-color:var(--primary);color:var(--primary);}
.day-btn.active{background:var(--navy);color:white;border-color:var(--navy);}
.day-btn.done{border-color:var(--success);}
.day-btn .dot{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--success);}
.day-btn .cnt{font-size:.65rem;opacity:.75;}

/* 단어집 */
.book-hdr{background:var(--navy);color:white;padding:14px 22px 12px;display:flex;align-items:baseline;justify-content:space-between;border-radius:12px 12px 0 0;}
.book-hdr .dn{font-size:1.7rem;font-weight:900;letter-spacing:2px;}
.book-hdr .dm{font-size:.72rem;opacity:.5;}
.word-book{background:white;border-radius:0 0 12px 12px;box-shadow:0 2px 10px rgba(0,0,0,.07);overflow:hidden;}
.entry{display:flex;border-bottom:1px solid var(--border);padding:13px 18px;}
.entry:last-child{border-bottom:none;}
.entry:hover{background:#f8fafc;}
.el{width:155px;min-width:155px;padding-right:14px;border-right:2px solid var(--border);}
.el .num{font-size:.62rem;font-weight:700;color:#94a3b8;margin-bottom:2px;}
.el .wd{font-size:1.1rem;font-weight:800;line-height:1.2;}
.el .ipa{font-size:.67rem;color:var(--muted);font-style:italic;margin-top:2px;}
.er{flex:1;padding-left:14px;}
.mline{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap;}
.pos{font-size:.65rem;font-weight:700;padding:1px 7px;border-radius:4px;white-space:nowrap;}
.mean{font-size:.93rem;font-weight:700;}
.ex{font-size:.78rem;color:#475569;line-height:1.55;}
.ex strong{color:var(--navy);font-weight:700;}
.etags{margin-top:6px;display:flex;gap:5px;}
.etag{font-size:.68rem;font-weight:600;padding:2px 8px;border:1.5px solid var(--border);border-radius:20px;color:var(--muted);cursor:pointer;}
.etag.known{border-color:var(--success);color:var(--success);background:#f0fdf4;}

/* 플래시카드 */
.fc-area{display:flex;flex-direction:column;align-items:center;gap:16px;}
.fc-counter{font-size:.85rem;color:var(--muted);}
.pbar{width:100%;max-width:460px;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.pfill{height:100%;background:var(--primary);border-radius:3px;transition:width .3s;}
.flashcard{width:100%;max-width:460px;height:255px;perspective:1000px;cursor:pointer;user-select:none;}
.ci{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .42s;}
.flashcard.flipped .ci{transform:rotateY(180deg);}
.cf{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;box-shadow:0 6px 22px rgba(0,0,0,.1);}
.cf.front{background:linear-gradient(135deg,var(--navy),var(--primary));color:white;}
.cf.back{background:white;transform:rotateY(180deg);border:2px solid var(--border);}
.cf.front .fw{font-size:2rem;font-weight:800;}
.cf.front .fp{font-size:.88rem;margin-top:7px;background:rgba(255,255,255,.2);padding:2px 12px;border-radius:20px;}
.cf.front .fh{font-size:.75rem;opacity:.5;margin-top:16px;}
.cf.back .bw{font-size:.9rem;color:var(--muted);margin-bottom:7px;}
.cf.back .bm{font-size:1.45rem;font-weight:800;color:var(--primary);text-align:center;}
.cf.back .be{font-size:.78rem;color:var(--muted);text-align:center;margin-top:10px;line-height:1.55;font-style:italic;}
.card-acts{display:flex;gap:9px;}
.btn{padding:10px 22px;border:none;border-radius:11px;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .13s;}
.btn-ok{background:var(--success);color:white;}
.btn-ok:hover{background:#16a34a;transform:translateY(-1px);}
.btn-no{background:var(--danger);color:white;}
.btn-no:hover{background:#dc2626;transform:translateY(-1px);}
.btn-skip{background:var(--border);color:var(--muted);}
.btn-skip:hover{background:#cbd5e1;}
.btn-primary{background:var(--primary);color:white;}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px);}
.btn-navy{background:var(--navy);color:white;}
.btn-navy:hover{background:#162d4a;transform:translateY(-1px);}

/* 퀴즈 */
.quiz-area{display:flex;flex-direction:column;align-items:center;gap:16px;}
.quiz-hdr-bar{width:100%;max-width:540px;display:flex;align-items:center;justify-content:space-between;font-size:.83rem;color:var(--muted);}
.quiz-card{width:100%;max-width:540px;background:white;border-radius:18px;padding:30px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.07);}
.quiz-card .qword{font-size:1.8rem;font-weight:800;color:var(--navy);}
.quiz-card .qpos{font-size:.83rem;color:var(--muted);margin-top:4px;}
.quiz-card .qex{font-size:.8rem;color:var(--muted);margin-top:10px;font-style:italic;line-height:1.5;}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:540px;}
.qopt{padding:14px;background:white;border:2px solid var(--border);border-radius:12px;cursor:pointer;font-size:.92rem;font-weight:600;text-align:center;transition:all .13s;}
.qopt:hover:not(.answered){border-color:var(--primary);color:var(--primary);transform:translateY(-1px);}
.qopt.correct{background:#dcfce7;border-color:var(--success);color:#166534;}
.qopt.wrong{background:#fee2e2;border-color:var(--danger);color:#991b1b;}

/* 결과 화면 */
.result{text-align:center;padding:36px 16px;}
.result h2{font-size:1.7rem;font-weight:800;color:var(--navy);}
.result .score{font-size:3rem;font-weight:900;color:var(--primary);margin:8px 0;}
.result p{color:var(--muted);margin:4px 0;}
.result-actions{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap;}

/* 일일 퀴즈 배너 */
.quiz-banner{background:linear-gradient(135deg,var(--navy),var(--primary));color:white;border-radius:14px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:0;}
.quiz-banner .qb-text h3{font-size:1.05rem;font-weight:700;margin-bottom:3px;}
.quiz-banner .qb-text p{font-size:.8rem;opacity:.8;}
.quiz-banner .qb-btn{background:white;color:var(--navy);border:none;padding:10px 20px;border-radius:10px;font-weight:700;font-size:.88rem;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.quiz-banner .qb-btn:hover{background:#f0f9ff;}

/* 통계 */
.scard{background:white;border-radius:14px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:12px;}
.scard h3{font-size:.92rem;font-weight:700;margin-bottom:12px;}

@media(max-width:500px){
  .quiz-opts{grid-template-columns:1fr;}
  .el{width:120px;min-width:120px;}
  .day-grid{grid-template-columns:repeat(auto-fill,minmax(68px,1fr));}
  .quiz-banner{flex-direction:column;text-align:center;}
}
</style>
</head>

</div>

 ""}, {"word": "★topic", "pos": "n.", "meaning": "주제 [복습]", "example": "Choose a topic that interests you.", "day": "Day 103", "ipa": ""}, {"word": "★trace", "pos": "v./n.", "meaning": "추적하다/흔적 [복습]", "example": "Scientists can trace the origin of the species.", "day": "Day 103", "ipa": ""}, {"word": "★tradition", "pos": "n.", "meaning": "전통 [복습]", "example": "Oral tradition passes knowledge through generations.", "day": "Day 103", "ipa": ""}, {"word": "★transfer", "pos": "v./n.", "meaning": "이동하다/이동 [복습]", "example": "Heat transfer occurs through conduction.", "day": "Day 103", "ipa": ""}, {"word": "★transform", "pos": "v.", "meaning": "변형시키다 [복습]", "example": "The internet has transformed communication.", "day": "Day 103", "ipa": ""}, {"word": "★transit", "pos": "n.", "meaning": "통과, 교통 [복습]", "example": "Public transit reduces carbon emissions.", "day": "Day 103", "ipa": ""}, {"word": "★transmit", "pos": "v.", "meaning": "전송하다 [복습]", "example": "Viruses transmit through various means.", "day": "Day 103", "ipa": ""}, {"word": "★transport", "pos": "v./n.", "meaning": "운송하다/운송 [복습]", "example": "Blood transports oxygen throughout the body.", "day": "Day 103", "ipa": ""}, {"word": "★trend", "pos": "n.", "meaning": "추세 [복습]", "example": "The trend shows increasing temperatures.", "day": "Day 103", "ipa": ""}, {"word": "★trigger", "pos": "v./n.", "meaning": "촉발하다/방아쇠 [복습]", "example": "Stress can trigger anxiety disorders.", "day": "Day 103", "ipa": ""}, {"word": "★ultimate", "pos": "adj.", "meaning": "궁극적인 [복습]", "example": "The ultimate goal is to cure the disease.", "day": "Day 103", "ipa": ""}, {"word": "★undergo", "pos": "v.", "meaning": "겪다 [복습]", "example": "Patients undergo surgery to remove tumors.", "day": "Day 103", "ipa": ""}, {"word": "★underlie", "pos": "v.", "meaning": "~의 기저에 있다 [복습]", "example": "Several factors underlie the problem.", "day": "Day 103", "ipa": ""}, {"word": "★undertake", "pos": "v.", "meaning": "착수하다 [복습]", "example": "The team undertook a comprehensive study.", "day": "Day 103", "ipa": ""}, {"word": "★uniform", "pos": "adj./n.", "meaning": "균일한/유니폼 [복습]", "example": "The distribution should be uniform.", "day": "Day 103", "ipa": ""}, {"word": "★unify", "pos": "v.", "meaning": "통합하다 [복습]", "example": "Einstein sought to unify the forces of nature.", "day": "Day 103", "ipa": ""}, {"word": "★unique", "pos": "adj.", "meaning": "고유한 [복습]", "example": "Each fingerprint is unique.", "day": "Day 103", "ipa": ""}, {"word": "★utilize", "pos": "v.", "meaning": "활용하다 [복습]", "example": "Scientists utilize advanced technology.", "day": "Day 103", "ipa": ""}];

const S = {
  tab:'book', day:'Day 01',
  cardIdx:0, flipped:false,
  known: JSON.parse(localStorage.getItem('toefl_known')||'{}'),
  // 퀴즈 상태
  qMode:null,        // 'daily' | 'free'
  qDay:'Day 01',
  qWords:[], qIdx:0, qScore:0, qTotal:0,
  qDone:false,
  qType:0,           // 0=뜻 맞추기, 1=단어 맞추기
};

function saveKnown(){ localStorage.setItem('toefl_known', JSON.stringify(S.known)); }
function dayWords(day){ return VOCAB.filter(w=>w.day===day); }
function allDays(){ return [...new Set(VOCAB.map(w=>w.day))].sort(); }
function knownCount(){ return Object.values(S.known).filter(Boolean).length; }
function dayKnown(day){ return dayWords(day).filter(w=>S.known[day+'_'+w.word]).length; }

function posStyle(pos){
  const p=(pos||'').toLowerCase();
  if(p.startsWith('v'))   return 'color:#2563eb;background:#dbeafe';
  if(p.startsWith('adj')) return 'color:#7c3aed;background:#ede9fe';
  if(p.startsWith('n'))   return 'color:#0891b2;background:#cffafe';
  if(p.startsWith('adv')) return 'color:#059669;background:#d1fae5';
  return 'color:#374151;background:#f3f4f6';
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hl(s,w){
  if(!s||!w) return esc(s||'');
  const re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?:s|ed|ing|ly|tion|ment|er|est|al)?)','gi');
  return esc(s).replace(re,'<strong>$1</strong>');
}

function updateHeader(){
  const t=VOCAB.length, k=knownCount();
  document.getElementById('hstats').textContent=`암기 ${k}/${t} (${Math.round(k/t*100)}%)`;
}

// ── 날 선택 그리드 ──────────────────────────────────────────────
function dayGridHTML(activeDay){
  return allDays().map(d=>{
    const ws=dayWords(d), dk=dayKnown(d), done=dk===ws.length&&ws.length>0;
    return `<div class="day-btn ${d===activeDay?'active':''} ${done?'done':''}" onclick="selDay('${d}')">${d}${done?'<div class=\'dot\'></div>':''}<div class="cnt">${dk}/${ws.length}</div></div>`;
  }).join('');
}
function selDay(d){ S.day=d; S.cardIdx=0; S.flipped=false; render(); }

// ── 일일 퀴즈 완료 여부 ────────────────────────────────────────
function dailyQuizDone(day){
  return localStorage.getItem('quiz_done_'+day)==='1';
}
function markDailyQuizDone(day){
  localStorage.setItem('quiz_done_'+day,'1');
}

// ─────────────────────────────────────────────────────────────────
// 단어집 탭
// ─────────────────────────────────────────────────────────────────
function renderBook(){
  const ws=dayWords(S.day);
  const dk=dayKnown(S.day);
  const allDone=dk===ws.length;

  const banner = allDone && !dailyQuizDone(S.day) ? `
    <div class="quiz-banner" style="margin-bottom:16px">
      <div class="qb-text">
        <h3>🎉 ${S.day} 완료!</h3>
        <p>${S.day} 단어 ${ws.length}개를 모두 암기했어요. 복습 퀴즈를 풀어볼까요?</p>
      </div>
      <button class="qb-btn" onclick="startDailyQuiz('${S.day}')">복습 퀴즈 시작</button>
    </div>` : '';

  const entries = ws.map((w,i)=>{
    const key=w.day+'_'+w.word, isK=S.known[key];
    const ipaH=w.ipa?`<div class="ipa">${esc(w.ipa)}</div>`:'';
    return `<div class="entry">
      <div class="el"><div class="num">${String(i+1).padStart(2,'0')}</div><div class="wd">${esc(w.word)}</div>${ipaH}</div>
      <div class="er">
        <div class="mline"><span class="pos" style="${posStyle(w.pos)}">${esc(w.pos)}</span><span class="mean">${esc(w.meaning)}</span></div>
        <div class="ex">${hl(w.example,w.word)}</div>
        <div class="etags"><span class="etag ${isK?'known':''}" onclick="toggleKnown('${key}',this)">${isK?'✓ 암기':'미암기'}</span></div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="day-grid">${dayGridHTML(S.day)}</div>
    ${banner}
    <div class="book-hdr"><span class="dn">${S.day.toUpperCase()}</span><span class="dm">${ws.length} words · 암기 ${dk}개</span></div>
    <div class="word-book">${entries}</div>`;
}

function toggleKnown(key,el){
  S.known[key]=!S.known[key]; saveKnown(); updateHeader();
  el.className='etag'+(S.known[key]?' known':'');
  el.textContent=S.known[key]?'✓ 암기':'미암기';
  // 배너 업데이트
  const ws=dayWords(S.day), dk=dayKnown(S.day);
  if(dk===ws.length && !dailyQuizDone(S.day)){
    const existing=document.querySelector('.quiz-banner');
    if(!existing){
      const banner=document.createElement('div');
      banner.className='quiz-banner';
      banner.style.marginBottom='16px';
      banner.innerHTML=`<div class="qb-text"><h3>🎉 ${S.day} 완료!</h3><p>${S.day} 단어 ${ws.length}개를 모두 암기했어요. 복습 퀴즈를 풀어볼까요?</p></div><button class="qb-btn" onclick="startDailyQuiz('${S.day}')">복습 퀴즈 시작</button>`;
      document.querySelector('.day-grid').after(banner);
    }
  }
}

// ─────────────────────────────────────────────────────────────────
// 플래시카드 탭
// ─────────────────────────────────────────────────────────────────
function renderFlash(){
  const ws=dayWords(S.day), w=ws[S.cardIdx], dk=dayKnown(S.day);

  if(!w){
    // 플래시카드 완료 → 퀴즈 배너 표시
    const quizDone=dailyQuizDone(S.day);
    document.getElementById('app').innerHTML=`
      <div class="day-grid">${dayGridHTML(S.day)}</div>
      <div class="result">
        <h2>📖 ${S.day} 학습 완료!</h2>
        <p style="color:var(--muted);margin:8px 0">${dk}개 암기 완료</p>
        ${!quizDone?`
        <div class="quiz-banner" style="margin:20px 0;text-align:left">
          <div class="qb-text"><h3>복습 퀴즈로 확인하기</h3><p>방금 배운 ${ws.length}개 단어를 퀴즈로 점검해볼까요?</p></div>
          <button class="qb-btn" onclick="startDailyQuiz('${S.day}')">퀴즈 시작</button>
        </div>` : '<p style="color:var(--success);font-weight:700;margin-top:12px">✓ 오늘의 복습 퀴즈 완료!</p>'}
        <div class="result-actions">
          <button class="btn btn-skip" onclick="S.cardIdx=0;S.flipped=false;render()">다시 학습</button>
        </div>
      </div>`;
    return;
  }

  const pct=Math.round(S.cardIdx/ws.length*100);
  document.getElementById('app').innerHTML=`
    <div class="day-grid">${dayGridHTML(S.day)}</div>
    <div class="fc-area">
      <div class="fc-counter">${S.cardIdx+1} / ${ws.length} · 암기 ${dk}개</div>
      <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
      <div class="flashcard${S.flipped?' flipped':''}" id="fc" onclick="flipCard()">
        <div class="ci">
          <div class="cf front"><div class="fw">${esc(w.word)}</div><div class="fp">${esc(w.pos)}</div><div class="fh">탭하여 뜻 확인</div></div>
          <div class="cf back"><div class="bw">${esc(w.word)} ${esc(w.pos)}</div><div class="bm">${esc(w.meaning)}</div><div class="be">${esc(w.example)}</div></div>
        </div>
      </div>
      <div class="card-acts">
        <button class="btn btn-no" onclick="markCard(false)">모르겠어요</button>
        <button class="btn btn-skip" onclick="nextCard()">건너뛰기</button>
        <button class="btn btn-ok" onclick="markCard(true)">알았어요!</button>
      </div>
    </div>`;
}

function flipCard(){ S.flipped=!S.flipped; const f=document.getElementById('fc'); if(f)f.className='flashcard'+(S.flipped?' flipped':''); }
function nextCard(){ const ws=dayWords(S.day); S.cardIdx=Math.min(S.cardIdx+1,ws.length); S.flipped=false; render(); }
function markCard(k){ const ws=dayWords(S.day),w=ws[S.cardIdx]; if(w){S.known[w.day+'_'+w.word]=k;saveKnown();} nextCard(); }

// ─────────────────────────────────────────────────────────────────
// 퀴즈 탭 & 일일 복습 퀴즈
// ─────────────────────────────────────────────────────────────────
function startDailyQuiz(day){
  // 탭을 퀴즈로 전환 후 해당 날 퀴즈 시작
  S.tab='quiz'; S.qMode='daily'; S.qDay=day;
  document.querySelectorAll('.tab').forEach((t,i)=>{t.className='tab'+(['book','flash','quiz','stats'][i]==='quiz'?' active':'');});
  initQuiz(dayWords(day).slice(), 'daily', 'both');
}

function initQuiz(wordList, mode, qtype){
  // qtype: 'meaning'(뜻 고르기) | 'word'(단어 고르기) | 'both'(혼합)
  S.qMode=mode;
  S.qWords=wordList.sort(()=>Math.random()-.5);
  S.qIdx=0; S.qScore=0; S.qTotal=S.qWords.length; S.qDone=false;
  S.qtype=qtype;
  render();
}

function renderQuiz(){
  if(S.qDone){ renderQuizResult(); return; }

  // 퀴즈 미시작
  if(!S.qWords.length){
    const btns=allDays().map(d=>{
      const done=dailyQuizDone(d);
      return `<div class="day-btn ${done?'done':''}" onclick="initQuiz(dayWords('${d}').slice(),'free','both')" style="cursor:pointer">${d}${done?'<div class=\'dot\'></div>':''}<div class="cnt">${dayWords(d).length}개</div></div>`;
    }).join('');
    document.getElementById('app').innerHTML=`
      <div style="font-weight:700;font-size:1rem;margin-bottom:12px">복습할 날을 선택하세요</div>
      <div style="font-size:.82rem;color:var(--muted);margin-bottom:14px">각 날의 전체 단어로 혼합 퀴즈를 진행합니다.</div>
      <div class="day-grid">${btns}</div>`;
    return;
  }

  const w=S.qWords[S.qIdx];
  // 혼합: 짝수 인덱스=뜻 고르기, 홀수=단어 고르기
  const isMeaningQ = S.qtype==='meaning' || (S.qtype==='both' && S.qIdx%2===0);

  let question, correctAns, allOptions;
  if(isMeaningQ){
    // 단어 보여주고 → 뜻 고르기
    question=`<div class="qword">${esc(w.word)}</div><div class="qpos">${esc(w.pos)}</div><div class="qex">${esc(w.example)}</div>`;
    correctAns=w.meaning;
    const wrongs=[...new Set(VOCAB.filter(x=>x.meaning!==w.meaning).map(x=>x.meaning))].sort(()=>Math.random()-.5).slice(0,3);
    allOptions=[correctAns,...wrongs].sort(()=>Math.random()-.5);
  } else {
    // 뜻 보여주고 → 단어 고르기
    question=`<div class="qword" style="font-size:1.4rem">${esc(w.meaning)}</div><div class="qpos">${esc(w.pos)}</div>`;
    correctAns=w.word;
    const wrongs=[...new Set(VOCAB.filter(x=>x.word!==w.word).map(x=>x.word))].sort(()=>Math.random()-.5).slice(0,3);
    allOptions=[correctAns,...wrongs].sort(()=>Math.random()-.5);
  }

  const pct=Math.round(S.qIdx/S.qTotal*100);
  const qLabel=isMeaningQ?'뜻을 고르세요':'단어를 고르세요';

  document.getElementById('app').innerHTML=`
    <div class="quiz-area">
      <div class="quiz-hdr-bar">
        <span style="font-weight:700">${S.qMode==='daily'?S.qDay+' 복습 퀴즈':'자유 퀴즈'}</span>
        <span>${S.qIdx+1}/${S.qTotal} · 정답 ${S.qScore}</span>
      </div>
      <div class="pbar" style="max-width:540px;width:100%"><div class="pfill" style="width:${pct}%"></div></div>
      <div style="font-size:.78rem;color:var(--muted);font-weight:600">${qLabel}</div>
      <div class="quiz-card">${question}</div>
      <div class="quiz-opts">
        ${allOptions.map(o=>`<div class="qopt" onclick="answerQ(this,'${escA(o)}','${escA(correctAns)}')">${esc(o)}</div>`).join('')}
      </div>
    </div>`;
}

function escA(s){ return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function answerQ(el, chosen, correct){
  if(el.classList.contains('answered')) return;
  document.querySelectorAll('.qopt').forEach(e=>e.classList.add('answered'));
  if(chosen===correct){ el.classList.add('correct'); S.qScore++; }
  else{
    el.classList.add('wrong');
    document.querySelectorAll('.qopt').forEach(e=>{ if(e.textContent.trim()===correct) e.classList.add('correct'); });
  }
  setTimeout(()=>{
    S.qIdx++;
    if(S.qIdx>=S.qTotal){ S.qDone=true; if(S.qMode==='daily') markDailyQuizDone(S.qDay); }
    render();
  }, 900);
}

function renderQuizResult(){
  const pct=Math.round(S.qScore/S.qTotal*100);
  const grade = pct>=90?'🏆 완벽해요!':pct>=70?'👍 잘했어요!':pct>=50?'💪 조금 더 힘내요!':'📚 다시 복습해봐요';
  document.getElementById('app').innerHTML=`
    <div class="result">
      <h2>${grade}</h2>
      <div class="score">${pct}%</div>
      <p>${S.qScore} / ${S.qTotal} 정답</p>
      ${S.qMode==='daily'?`<p style="color:var(--success);font-weight:600;margin-top:6px">✓ ${S.qDay} 복습 퀴즈 완료!</p>`:''}
      <div class="result-actions">
        <button class="btn btn-primary" onclick="initQuiz(dayWords(S.qDay).slice(),S.qMode,'both')">다시 풀기</button>
        ${pct<70?`<button class="btn btn-navy" onclick="initQuiz(S.qWords.filter((_,i)=>i<S.qIdx).slice(),'retry','both')">틀린 문제만</button>`:''}
        <button class="btn btn-skip" onclick="S.qWords=[];S.qDone=false;render()">날 선택</button>
        ${S.qMode==='daily'?`<button class="btn btn-skip" onclick="switchTab('book')">단어집으로</button>`:''}
      </div>
    </div>`;
}

// ─────────────────────────────────────────────────────────────────
// 통계 탭
// ─────────────────────────────────────────────────────────────────
function renderStats(){
  const days=allDays(), total=VOCAB.length, known=knownCount();
  const pct=Math.round(known/total*100);
  const dayStats=days.map(d=>{ const ws=dayWords(d),k=dayKnown(d); return {d,t:ws.length,k,p:Math.round(k/ws.length*100),qd:dailyQuizDone(d)}; });
  const bars=dayStats.map(ds=>`
    <div style="display:flex;align-items:center;gap:7px;margin-bottom:4px">
      <div style="width:54px;font-size:.72rem;color:var(--muted);text-align:right">${ds.d}</div>
      <div style="flex:1;height:14px;background:var(--border);border-radius:7px;overflow:hidden">
        <div style="height:100%;width:${ds.p}%;background:${ds.p===100?'var(--success)':ds.p>50?'var(--primary)':'var(--warning)'};border-radius:7px"></div>
      </div>
      <div style="width:36px;font-size:.72rem;color:var(--muted)">${ds.k}/${ds.t}</div>
      ${ds.qd?'<span style="font-size:.65rem;color:var(--success);font-weight:700">Q✓</span>':'<span style="width:22px"></span>'}
    </div>`).join('');

  const quizDoneCount=dayStats.filter(d=>d.qd).length;

  document.getElementById('app').innerHTML=`
    <div class="scard">
      <h3>전체 진행률</h3>
      <div style="text-align:center;padding:14px 0">
        <div style="font-size:2.8rem;font-weight:900;color:var(--navy)">${pct}%</div>
        <div style="color:var(--muted);margin-top:3px">${known} / ${total} 단어 암기</div>
      </div>
      <div style="height:9px;background:var(--border);border-radius:5px;overflow:hidden;margin:10px 0">
        <div style="height:100%;width:${pct}%;background:var(--navy);border-radius:5px;transition:width 1s"></div>
      </div>
    </div>
    <div class="scard">
      <h3>일별 진행률 <span style="font-size:.75rem;color:var(--muted);font-weight:400">(Q✓ = 복습 퀴즈 완료)</span></h3>
      ${bars}
    </div>
    <div class="scard" style="display:flex;gap:10px;flex-wrap:wrap;text-align:center">
      <div style="flex:1;min-width:90px"><div style="font-size:1.6rem;font-weight:800;color:var(--success)">${dayStats.filter(d=>d.p===100).length}</div><div style="font-size:.78rem;color:var(--muted)">완료일</div></div>
      <div style="flex:1;min-width:90px"><div style="font-size:1.6rem;font-weight:800;color:var(--primary)">${dayStats.filter(d=>d.p>0&&d.p<100).length}</div><div style="font-size:.78rem;color:var(--muted)">진행 중</div></div>
      <div style="flex:1;min-width:90px"><div style="font-size:1.6rem;font-weight:800;color:var(--navy)">${quizDoneCount}</div><div style="font-size:.78rem;color:var(--muted)">퀴즈 완료일</div></div>
      <div style="flex:1;min-width:90px"><div style="font-size:1.6rem;font-weight:800;color:var(--warning)">${total-known}</div><div style="font-size:.78rem;color:var(--muted)">남은 단어</div></div>
    </div>
    <div style="text-align:center;margin-top:12px">
      <button class="btn btn-no" onclick="if(confirm('모든 학습 기록을 초기화할까요?')){localStorage.clear();S.known={};render();updateHeader();}">전체 초기화</button>
    </div>`;
}

// ─────────────────────────────────────────────────────────────────
// 라우터
// ─────────────────────────────────────────────────────────────────
function switchTab(tab){
  S.tab=tab;
  document.querySelectorAll('.tab').forEach((t,i)=>{t.className='tab'+(['book','flash','quiz','stats'][i]===tab?' active':'');});
  if(tab!=='quiz'){ S.qWords=[]; S.qDone=false; }
  render();
}

function render(){
  updateHeader();
  if(S.tab==='book')  renderBook();
  else if(S.tab==='flash') renderFlash();
  else if(S.tab==='quiz')  renderQuiz();
  else renderStats();
}

render();
</script>
</body>
</html>
